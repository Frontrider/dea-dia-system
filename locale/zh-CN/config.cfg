[factoriopedia-description]
gas-collector=气体收集器悬浮在气态巨行星大气中，提供建造平台、机器人端口和大气泵（输出建造位置对流层资源类型）。因质量巨大需在零重力环境制造。内置动力源维持悬浮状态。
